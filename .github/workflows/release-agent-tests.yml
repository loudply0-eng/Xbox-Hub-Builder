name: Xbox Hub release-agent security tests

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/release-agent-tests.yml"
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/release-agent-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xboxhub-release-agent-tests
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release-agent source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check "cryptography>=43,<48"
      - name: Compile release-agent modules
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m py_compile deploy/xboxhub_release_agent.py deploy/test_xboxhub_release_agent.py
      - name: Run cryptographic and release-metadata regression tests
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m unittest discover -s deploy -p 'test_*.py' -v
