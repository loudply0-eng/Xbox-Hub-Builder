name: Xbox Hub release-agent security tests

on:
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/release-agent-tests.yml"
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/release-agent-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xboxhub-release-agent-tests
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release-agent source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up isolated Python environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r deploy/requirements.txt
      - name: Compile release-agent modules
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m py_compile deploy/xboxhub_release_agent.py deploy/prepare_oci_rsa_import.py deploy/test_xboxhub_release_agent.py
          bash -n deploy/install-xboxhub-release-agent.sh
      - name: Verify the OCI SDK crypto models used by the agent
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import oci
          from oci.key_management.models import DecryptDataDetails, SignDataDetails
          print("OCI SDK version:", oci.__version__)
          DecryptDataDetails(key_id="key", ciphertext="YQ==", encryption_algorithm="RSA_OAEP_SHA_256")
          SignDataDetails(key_id="key", message="YQ==", message_type="RAW", signing_algorithm="SHA_256_RSA_PKCS1_V1_5")
          PY
      - name: Run cryptographic and release-metadata regression tests
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m unittest discover -s deploy -p 'test_*.py' -v
