name: Windows WPF build and package validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/xbox-hub-build-trigger.txt"

permissions:
  contents: read

concurrency:
  group: xbox-hub-windows-build
  cancel-in-progress: true

jobs:
  build-private-windows-app:
    # This job uses the private-source deploy key. Never run it from untrusted refs.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out private Xbox Hub source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: loudply0-eng/Xbox-Hub-for-PC
          ref: main
          ssh-key: ${{ secrets.SOURCE_REPO_DEPLOY_KEY }}
          path: private-source
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.x'

      - name: Restore Windows x64 app and updater
        shell: pwsh
        run: |
          $app = "private-source/src/XboxHub.Desktop/XboxHub.Desktop.csproj"
          $updater = "private-source/src/XboxHub.Updater/XboxHub.Updater.csproj"
          if (-not (Test-Path $app)) { throw "Xbox Hub WPF project file is missing." }
          if (-not (Test-Path $updater)) { throw "Xbox Hub updater helper project file is missing." }

          dotnet restore $app --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw "WPF restore failed." }

          dotnet restore $updater --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw "Updater helper restore failed." }

      - name: Publish single-file Windows app
        shell: pwsh
        run: |
          $app = "private-source/src/XboxHub.Desktop/XboxHub.Desktop.csproj"
          $output = Join-Path $env:RUNNER_TEMP "xboxhub-app-publish"
          dotnet publish $app --configuration Release --runtime win-x64 --self-contained true --no-restore --verbosity minimal -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o $output
          if ($LASTEXITCODE -ne 0) { throw "WPF publish failed." }

          $exe = Join-Path $output "XboxHub.exe"
          if (-not (Test-Path $exe)) { throw "Self-contained XboxHub.exe was not produced." }
          if ((Get-Item $exe).Length -lt 1MB) { throw "XboxHub.exe is unexpectedly small." }

      - name: Publish standalone updater helper
        shell: pwsh
        run: |
          $updater = "private-source/src/XboxHub.Updater/XboxHub.Updater.csproj"
          $output = Join-Path $env:RUNNER_TEMP "xboxhub-updater-publish"
          dotnet publish $updater --configuration Release --runtime win-x64 --self-contained true --no-restore --verbosity minimal -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o $output
          if ($LASTEXITCODE -ne 0) { throw "Updater helper publish failed." }

          $exe = Join-Path $output "XboxHub.Updater.exe"
          if (-not (Test-Path $exe)) { throw "Self-contained XboxHub.Updater.exe was not produced." }
          if ((Get-Item $exe).Length -lt 1MB) { throw "XboxHub.Updater.exe is unexpectedly small." }

      - name: Validate update package layout without uploading it
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $appExe = Join-Path $env:RUNNER_TEMP "xboxhub-app-publish/XboxHub.exe"
          $updaterExe = Join-Path $env:RUNNER_TEMP "xboxhub-updater-publish/XboxHub.Updater.exe"
          $packageDir = Join-Path $env:RUNNER_TEMP "xboxhub-package"
          $zipPath = Join-Path $env:RUNNER_TEMP "XboxHub-win-x64-validation.zip"

          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -LiteralPath $appExe -Destination (Join-Path $packageDir "XboxHub.exe")
          Copy-Item -LiteralPath $updaterExe -Destination (Join-Path $packageDir "XboxHub.Updater.exe")
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zipPath -CompressionLevel Optimal -Force

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($archive.Entries.Count -ne 2) { throw "Package must contain exactly two executables." }
            if ($names -notcontains "XboxHub.exe" -or $names -notcontains "XboxHub.Updater.exe") {
              throw "Package file layout is unexpected."
            }
          }
          finally {
            $archive.Dispose()
          }

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash
          $size = (Get-Item -LiteralPath $zipPath).Length
          if ($size -gt 700MB) { throw "Package exceeds the updater's 700 MiB limit." }
          Write-Host "Validated per-user update package."
          Write-Host "Package bytes: $size"
          Write-Host "Package SHA-256: $hash"
          Write-Host "Package is temporary and will not be uploaded."

      - name: Exercise update rollback in a disposable runner directory
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $updaterExe = Join-Path $env:RUNNER_TEMP "xboxhub-updater-publish/XboxHub.Updater.exe"
          if (-not (Test-Path -LiteralPath $updaterExe)) { throw "Published updater helper is missing." }

          # Build a harmless GUI-subsystem executable with no message loop. It starts,
          # exits without becoming ready, and deterministically forces the helper to roll back.
          $stubDirectory = Join-Path $env:RUNNER_TEMP "xboxhub-rollback-stub"
          New-Item -ItemType Directory -Path $stubDirectory -Force | Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <RuntimeIdentifier>win-x64</RuntimeIdentifier>
              <SelfContained>true</SelfContained>
              <PublishSingleFile>true</PublishSingleFile>
              <UseAppHost>true</UseAppHost>
              <ImplicitUsings>enable</ImplicitUsings>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -LiteralPath (Join-Path $stubDirectory "RollbackStub.csproj") -Encoding utf8
          @'
          internal static class Program
          {
              [System.STAThread]
              private static void Main()
              {
                  return;
              }
          }
          '@ | Set-Content -LiteralPath (Join-Path $stubDirectory "Program.cs") -Encoding utf8

          $stubOutput = Join-Path $env:RUNNER_TEMP "xboxhub-rollback-stub-publish"
          dotnet publish (Join-Path $stubDirectory "RollbackStub.csproj") --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o $stubOutput --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "Rollback test stub publish failed." }

          $stubExe = Join-Path $stubOutput "RollbackStub.exe"
          if (-not (Test-Path -LiteralPath $stubExe)) { throw "Rollback test stub executable is missing." }
          if ((Get-Item -LiteralPath $stubExe).Length -le 1MB) { throw "Rollback test stub executable is unexpectedly small." }

          $testRoot = Join-Path $env:RUNNER_TEMP "XboxHub-Rollback-Test-$([Guid]::NewGuid().ToString('N'))"
          $installDirectory = Join-Path $testRoot "InstalledApp"
          $packageDirectory = Join-Path $testRoot "Package"
          $localUpdates = Join-Path $env:LOCALAPPDATA "XboxHub/Updates"
          $packagePath = Join-Path $localUpdates "rollback-test-$([Guid]::NewGuid().ToString('N')).zip"

          New-Item -ItemType Directory -Path $installDirectory,$packageDirectory,$localUpdates -Force | Out-Null

          try {
            $oldApp = Join-Path $installDirectory "XboxHub.exe"
            Copy-Item -LiteralPath $stubExe -Destination $oldApp
            Copy-Item -LiteralPath $stubExe -Destination (Join-Path $packageDirectory "XboxHub.exe")
            Copy-Item -LiteralPath $updaterExe -Destination (Join-Path $packageDirectory "XboxHub.Updater.exe")

            $oldHash = (Get-FileHash -LiteralPath $oldApp -Algorithm SHA256).Hash
            $archivePath = Join-Path $testRoot "rollback-test.zip"
            Compress-Archive -Path (Join-Path $packageDirectory "*") -DestinationPath $archivePath -CompressionLevel Optimal -Force
            Copy-Item -LiteralPath $archivePath -Destination $packagePath

            $packageHash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash
            & $updaterExe --apply-update --package $packagePath --install-directory $installDirectory --sha256 $packageHash --version "0.1.5" --parent-pid "2147483647"
            $updaterExit = $LASTEXITCODE

            if ($updaterExit -eq 0) { throw "The non-ready candidate unexpectedly reported success." }
            if (-not (Test-Path -LiteralPath $oldApp)) { throw "Rollback did not restore the original XboxHub.exe." }

            $restoredHash = (Get-FileHash -LiteralPath $oldApp -Algorithm SHA256).Hash
            if ($restoredHash -ne $oldHash) { throw "Rollback restored a file that differs from the original installation." }

            $resultPath = Join-Path $localUpdates "install-result.json"
            if (-not (Test-Path -LiteralPath $resultPath)) { throw "The updater did not write an installation result." }
            $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
            if ($result.status -ne "failed") { throw "The updater did not report the expected failed update state." }

            Write-Host "Rollback test passed: candidate did not become ready and the original app was restored byte-for-byte."
          }
          finally {
            Remove-Item -LiteralPath $testRoot -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $packagePath -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath (Join-Path $localUpdates "install-result.json") -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $stubDirectory -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $stubOutput -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke-test updater success and rollback paths
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          # Build a small headless WPF process so the helper's Windows GUI readiness
          # check can be exercised without launching the real application.
          $smokeRoot = Join-Path $env:RUNNER_TEMP "xboxhub-updater-smoke-app"
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          $smokeProject = @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>WinExe</OutputType>
              <TargetFramework>net10.0-windows</TargetFramework>
              <UseWPF>true</UseWPF>
              <EnableWindowsTargeting>true</EnableWindowsTargeting>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
              <AssemblyName>XboxHub</AssemblyName>
            </PropertyGroup>
          </Project>
          '@
          Set-Content -LiteralPath (Join-Path $smokeRoot "Smoke.csproj") -Value $smokeProject -Encoding utf8
          $smokeSource = @'
          using System.Windows;
          internal static class Program
          {
              [STAThread]
              private static void Main()
              {
                  var app = new Application();
                  app.Run();
              }
          }
          '@
          Set-Content -LiteralPath (Join-Path $smokeRoot "Program.cs") -Value $smokeSource -Encoding utf8

          $smokeOutput = Join-Path $env:RUNNER_TEMP "xboxhub-updater-smoke-publish"
          dotnet publish (Join-Path $smokeRoot "Smoke.csproj") --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o $smokeOutput --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "Updater smoke WPF application publish failed." }

          $smokeExe = Join-Path $smokeOutput "XboxHub.exe"
          $helperExe = Join-Path $env:RUNNER_TEMP "xboxhub-updater-publish/XboxHub.Updater.exe"
          if (-not (Test-Path $smokeExe) -or -not (Test-Path $helperExe)) { throw "Smoke-test binaries are missing." }

          $cache = Join-Path $env:LOCALAPPDATA "XboxHub/Updates"
          New-Item -ItemType Directory -Path $cache -Force | Out-Null
          $resultPath = Join-Path $cache "install-result.json"

          function New-UpdatePackage([string]$PackageName, [string]$AppFile) {
            $source = Join-Path $env:RUNNER_TEMP ([Guid]::NewGuid().ToString("N"))
            New-Item -ItemType Directory -Path $source -Force | Out-Null
            Copy-Item -LiteralPath $AppFile -Destination (Join-Path $source "XboxHub.exe")
            Copy-Item -LiteralPath $helperExe -Destination (Join-Path $source "XboxHub.Updater.exe")
            $package = Join-Path $cache $PackageName
            if (Test-Path $package) { Remove-Item -LiteralPath $package -Force }
            Compress-Archive -Path (Join-Path $source "*") -DestinationPath $package -CompressionLevel Optimal -Force
            Remove-Item -LiteralPath $source -Recurse -Force
            return $package
          }

          function Get-ExitedParentPid {
            $child = Start-Process -FilePath (Join-Path $PSHOME "pwsh.exe") -ArgumentList @("-NoProfile", "-Command", "exit 0") -PassThru -Wait
            return $child.Id
          }

          function Invoke-Updater([string]$Package, [string]$InstallDir, [string]$Version) {
            $hash = (Get-FileHash -LiteralPath $Package -Algorithm SHA256).Hash
            $parentPid = Get-ExitedParentPid
            $psi = [System.Diagnostics.ProcessStartInfo]::new($helperExe)
            $psi.UseShellExecute = $false
            $psi.CreateNoWindow = $true
            foreach ($argument in @(
              "--apply-update",
              "--package", $Package,
              "--install-directory", $InstallDir,
              "--sha256", $hash,
              "--version", $Version,
              "--parent-pid", [string]$parentPid
            )) {
              $psi.ArgumentList.Add($argument)
            }
            $process = [System.Diagnostics.Process]::Start($psi)
            if (-not $process.WaitForExit(120000)) {
              $process.Kill($true)
              throw "Updater smoke test timed out."
            }
            $exitCode = $process.ExitCode
            $process.Dispose()
            return $exitCode
          }

          function Stop-SmokeApp([string]$InstallDir) {
            $expected = [System.IO.Path]::GetFullPath((Join-Path $InstallDir "XboxHub.exe"))
            Get-Process -Name "XboxHub" -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -and [System.IO.Path]::GetFullPath($_.Path) -eq $expected } |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

          # Successful update: old app folder is replaced, new app starts, backup remains.
          $successInstall = Join-Path $env:RUNNER_TEMP "xboxhub-updater-success-install"
          New-Item -ItemType Directory -Path $successInstall -Force | Out-Null
          Copy-Item -LiteralPath $smokeExe -Destination (Join-Path $successInstall "XboxHub.exe")
          $oldHash = (Get-FileHash -LiteralPath (Join-Path $successInstall "XboxHub.exe") -Algorithm SHA256).Hash
          $successPackage = New-UpdatePackage "xboxhub-smoke-success.zip" $smokeExe
          if (Test-Path $resultPath) { Remove-Item -LiteralPath $resultPath -Force }
          $successExit = Invoke-Updater $successPackage $successInstall "0.1.5"
          if ($successExit -ne 0) { throw "Updater success-path returned exit code $successExit." }
          $successResult = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($successResult.status -ne "success" -or $successResult.version -ne "0.1.5") { throw "Updater success receipt is invalid." }
          if (-not (Test-Path (Join-Path $successInstall "XboxHub.Updater.exe"))) { throw "Updated helper was not installed." }
          if ((Get-FileHash -LiteralPath (Join-Path $successInstall "XboxHub.exe") -Algorithm SHA256).Hash -ne $oldHash) { throw "New app file hash differs from the expected smoke executable." }
          $successBackups = Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter ".xboxhub-updater-success-install.backup-*"
          if ($successBackups.Count -lt 1) { throw "Successful update did not retain a rollback backup." }
          Stop-SmokeApp $successInstall
          Write-Host "Updater successful replacement path passed."

          # Failed update: corrupt app executable must be rejected by Windows launch,
          # and the old known-good application folder must be restored.
          $rollbackInstall = Join-Path $env:RUNNER_TEMP "xboxhub-updater-rollback-install"
          New-Item -ItemType Directory -Path $rollbackInstall -Force | Out-Null
          Copy-Item -LiteralPath $smokeExe -Destination (Join-Path $rollbackInstall "XboxHub.exe")
          $knownGoodHash = (Get-FileHash -LiteralPath (Join-Path $rollbackInstall "XboxHub.exe") -Algorithm SHA256).Hash
          $badApp = Join-Path $env:RUNNER_TEMP "not-a-windows-executable.bin"
          $badBytes = New-Object byte[] (2MB)
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($badBytes)
          [System.IO.File]::WriteAllBytes($badApp, $badBytes)
          $badPackage = New-UpdatePackage "xboxhub-smoke-rollback.zip" $badApp
          if (Test-Path $resultPath) { Remove-Item -LiteralPath $resultPath -Force }
          $rollbackExit = Invoke-Updater $badPackage $rollbackInstall "0.1.6"
          if ($rollbackExit -eq 0) { throw "Updater incorrectly accepted a corrupt executable." }
          $failureResult = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($failureResult.status -ne "failed") { throw "Updater failure receipt is missing." }
          $restoredExe = Join-Path $rollbackInstall "XboxHub.exe"
          if (-not (Test-Path $restoredExe)) { throw "Previous app was not restored after failed update." }
          if ((Get-FileHash -LiteralPath $restoredExe -Algorithm SHA256).Hash -ne $knownGoodHash) { throw "Rollback did not restore the exact original app binary." }
          Stop-SmokeApp $rollbackInstall
          Write-Host "Updater rollback path passed."

          Remove-Item -LiteralPath $successPackage,$badPackage,$badApp -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $successInstall,$rollbackInstall -Recurse -Force -ErrorAction SilentlyContinue

      - name: Report build result without exposing source
        if: success()
        shell: pwsh
        run: |
          Write-Host "Xbox Hub for PC app and standalone updater published successfully."
          Write-Host "No source files, packages, keys, or build artifacts were uploaded."
