name: Windows WPF build and package validation

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - main
    paths:
      - ".github/xbox-hub-build-trigger.txt"

permissions:
  contents: read

concurrency:
  group: xbox-hub-windows-build
  cancel-in-progress: true

jobs:
  detect-private-source-revision:
    # The private-source deploy key is only used by trusted main-branch runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
      source_changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Check out private Xbox Hub source at main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: loudply0-eng/Xbox-Hub-for-PC
          ref: main
          ssh-key: ${{ secrets.SOURCE_REPO_DEPLOY_KEY }}
          path: private-source
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1

      - name: Read exact private-source revision
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git -C private-source rev-parse HEAD)"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Detected private source revision: $source_sha"

      - name: Skip scheduled build when this revision was already built
        id: compare
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          tag="xboxhub-source-$SOURCE_SHA"
          if git ls-remote --exit-code "https://github.com/loudply0-eng/Xbox-Hub-Builder.git" "refs/tags/$tag" >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "This private-source revision already has a successful build marker."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "This private-source revision has not been built successfully yet."
          fi

  build-private-windows-app:
    needs: detect-private-source-revision
    # This job uses the private-source deploy key. Never run it from untrusted refs.
    if: github.ref == 'refs/heads/main' && (github.event_name != 'schedule' || needs.detect-private-source-revision.outputs.source_changed == 'true')
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out private Xbox Hub source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: loudply0-eng/Xbox-Hub-for-PC
          ref: ${{ needs.detect-private-source-revision.outputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_REPO_DEPLOY_KEY }}
          path: private-source
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1

      - name: Validate offline key and signing helper syntax without executing them
        shell: pwsh
        run: |
          $helpers = @(
            "private-source/tools/New-XboxHubReleaseKey.ps1",
            "private-source/tools/sign-update-manifest.ps1",
            "private-source/tools/Encrypt-XboxHubPackage.ps1",
            "private-source/tools/Decrypt-XboxHubPackage.ps1"
          )
          foreach ($helper in $helpers) {
            if (-not (Test-Path -LiteralPath $helper)) { throw "Required offline signing helper is missing: $helper" }
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $helper).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.ToString() }
              throw "PowerShell parse errors found in $helper."
            }
            Write-Host "Syntax OK: $helper"
          }
          Write-Host "Neither helper was executed. No signing key was generated and no manifest was signed."

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73
        with:
          dotnet-version: '10.0.x'

      - name: Restore Windows x64 app and updater
        shell: pwsh
        run: |
          $app = "private-source/src/XboxHub.Desktop/XboxHub.Desktop.csproj"
          $updater = "private-source/src/XboxHub.Updater/XboxHub.Updater.csproj"
          if (-not (Test-Path $app)) { throw "Xbox Hub WPF project file is missing." }
          if (-not (Test-Path $updater)) { throw "Xbox Hub updater helper project file is missing." }

          dotnet restore $app --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw "WPF restore failed." }

          dotnet restore $updater --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw "Updater helper restore failed." }

      - name: Publish single-file Windows app
        shell: pwsh
        run: |
          $app = "private-source/src/XboxHub.Desktop/XboxHub.Desktop.csproj"
          $output = Join-Path $env:RUNNER_TEMP "xboxhub-app-publish"
          dotnet publish $app --configuration Release --runtime win-x64 --self-contained true --no-restore --verbosity minimal -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o $output
          if ($LASTEXITCODE -ne 0) { throw "WPF publish failed." }

          $exe = Join-Path $output "XboxHub.exe"
          if (-not (Test-Path $exe)) { throw "Self-contained XboxHub.exe was not produced." }
          if ((Get-Item $exe).Length -lt 1MB) { throw "XboxHub.exe is unexpectedly small." }

      - name: Publish standalone updater helper
        shell: pwsh
        run: |
          $updater = "private-source/src/XboxHub.Updater/XboxHub.Updater.csproj"
          $output = Join-Path $env:RUNNER_TEMP "xboxhub-updater-publish"
          dotnet publish $updater --configuration Release --runtime win-x64 --self-contained true --no-restore --verbosity minimal -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o $output
          if ($LASTEXITCODE -ne 0) { throw "Updater helper publish failed." }

          $exe = Join-Path $output "XboxHub.Updater.exe"
          if (-not (Test-Path $exe)) { throw "Self-contained XboxHub.Updater.exe was not produced." }
          if ((Get-Item $exe).Length -lt 1MB) { throw "XboxHub.Updater.exe is unexpectedly small." }

      - name: Validate update package layout without uploading it
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $appExe = Join-Path $env:RUNNER_TEMP "xboxhub-app-publish/XboxHub.exe"
          $updaterExe = Join-Path $env:RUNNER_TEMP "xboxhub-updater-publish/XboxHub.Updater.exe"
          $packageDir = Join-Path $env:RUNNER_TEMP "xboxhub-package"
          $zipPath = Join-Path $env:RUNNER_TEMP "XboxHub-win-x64-validation.zip"

          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item -LiteralPath $appExe -Destination (Join-Path $packageDir "XboxHub.exe")
          Copy-Item -LiteralPath $updaterExe -Destination (Join-Path $packageDir "XboxHub.Updater.exe")
          Compress-Archive -Path (Join-Path $packageDir "*") -DestinationPath $zipPath -CompressionLevel Optimal -Force

          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $names = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($archive.Entries.Count -ne 2) { throw "Package must contain exactly two executables." }
            if ($names -notcontains "XboxHub.exe" -or $names -notcontains "XboxHub.Updater.exe") {
              throw "Package file layout is unexpected."
            }
          }
          finally {
            $archive.Dispose()
          }

          $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash
          $size = (Get-Item -LiteralPath $zipPath).Length
          if ($size -gt 700MB) { throw "Package exceeds the updater's 700 MiB limit." }
          Write-Host "Validated per-user update package."
          Write-Host "Package bytes: $size"
          Write-Host "Package SHA-256: $hash"

          $appProject = "private-source/src/XboxHub.Desktop/XboxHub.Desktop.csproj"
          $version = (dotnet msbuild $appProject -getProperty:InformationalVersion -nologo).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version) -or $version -match '[^0-9A-Za-z.-]') {
            throw "Could not determine a safe application informational version."
          }
          $versionedZip = Join-Path $env:RUNNER_TEMP ("XboxHub-" + $version + "-win-x64.zip")
          Copy-Item -LiteralPath $zipPath -Destination $versionedZip -Force
          $versionedHash = (Get-FileHash -LiteralPath $versionedZip -Algorithm SHA256).Hash
          if ($versionedHash -cne $hash) { throw "Versioned ZIP copy does not match the validated package bytes." }
          Write-Host "Validated versioned package path: $versionedZip"
          Write-Host "Versioned package SHA-256 matches the validated archive."

      - name: Test offline manifest signing with a throwaway CI key
        shell: pwsh
        run: |
          $openssl = Get-Command openssl -ErrorAction SilentlyContinue
          if (-not $openssl) {
            $gitOpenSsl = Join-Path $env:ProgramFiles "Git/usr/bin/openssl.exe"
            if (Test-Path -LiteralPath $gitOpenSsl) {
              $env:PATH = "$(Split-Path -Parent $gitOpenSsl);$env:PATH"
              $openssl = Get-Command openssl -ErrorAction SilentlyContinue
            }
          }
          if (-not $openssl) { throw "OpenSSL is required to exercise the offline manifest signer." }

          $temp = Join-Path $env:RUNNER_TEMP ("xboxhub-signer-test-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $temp | Out-Null

          try {
            $appProject = "private-source/src/XboxHub.Desktop/XboxHub.Desktop.csproj"
            $zipPath = Join-Path $env:RUNNER_TEMP "XboxHub-win-x64-validation.zip"
            $testPrivate = Join-Path $temp "ephemeral-test-private.pem"
            $testPublicDer = Join-Path $temp "ephemeral-test-public.der"
            $testPublicPem = Join-Path $temp "ephemeral-test-public.pem"
            $payloadPath = Join-Path $temp "manifest-payload.json"
            $envelopePath = Join-Path $temp "manifest-envelope.json"
            $decodedPayload = Join-Path $temp "decoded-payload.json"
            $signaturePath = Join-Path $temp "decoded-signature.bin"

            & $openssl.Source genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out $testPrivate
            if ($LASTEXITCODE -ne 0) { throw "Could not create the ephemeral CI-only test key." }

            & $openssl.Source pkey -in $testPrivate -pubout -outform DER -out $testPublicDer
            if ($LASTEXITCODE -ne 0) { throw "Could not export the ephemeral test public key." }

            & $openssl.Source pkey -pubin -inform DER -in $testPublicDer -pubout -out $testPublicPem
            if ($LASTEXITCODE -ne 0) { throw "Could not export the ephemeral PEM public key." }

            $fingerprint = (Get-FileHash -LiteralPath $testPublicDer -Algorithm SHA256).Hash.ToLowerInvariant()
            $keyId = "xboxhub-rsa3072-" + $fingerprint.Substring(0, 16)
            $size = (Get-Item -LiteralPath $zipPath).Length
            $hash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash

            $payload = [ordered]@{
              schemaVersion = 1
              productId = "xbox-hub-for-pc"
              channel = "stable"
              version = "99.0.0"
              releaseSequence = 999999
              platform = "windows"
              architecture = "x64"
              packageUrl = "https://updates.mahmoudaljuorany.store/stable/XboxHub-99.0.0-win-x64.zip"
              packageFormat = "zip"
              packageSize = [long]$size
              packageSha256 = $hash
              minimumUpdaterVersion = "0.1.7"
              title = "Ephemeral Xbox Hub signer validation"
              date = (Get-Date -Format "yyyy-MM-dd")
              changes = @("CI-only signature test; this is not a release.")
            }
            $payloadJson = $payload | ConvertTo-Json -Depth 5
            [System.IO.File]::WriteAllText($payloadPath, $payloadJson, [System.Text.UTF8Encoding]::new($false))

            & pwsh -NoProfile -File "private-source/tools/sign-update-manifest.ps1" `
              -PayloadPath $payloadPath `
              -PackagePath $zipPath `
              -PrivateKeyPath $testPrivate `
              -KeyId $keyId `
              -OutputPath $envelopePath
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $envelopePath)) {
              throw "Offline manifest signing helper failed."
            }

            $envelope = Get-Content -LiteralPath $envelopePath -Raw | ConvertFrom-Json -ErrorAction Stop
            if ($envelope.keyId -cne $keyId) { throw "Signed envelope key ID mismatch." }
            [System.IO.File]::WriteAllBytes($decodedPayload, [Convert]::FromBase64String($envelope.payload))
            [System.IO.File]::WriteAllBytes($signaturePath, [Convert]::FromBase64String($envelope.signature))

            & $openssl.Source dgst -sha256 -verify $testPublicPem -signature $signaturePath $decodedPayload
            if ($LASTEXITCODE -ne 0) { throw "Independent verification of the signed envelope failed." }

            Write-Host "PASS: offline signer validated the payload and package, created the envelope, and verified its RSA signature."
            # Negative case 1: reject a payload whose signed digest does not match the ZIP.
            $badDigest = [ordered]@{}
            foreach ($entry in $payload.GetEnumerator()) { $badDigest[$entry.Key] = $entry.Value }
            $badDigest.packageSha256 = ("0" * 64)
            $badDigestPath = Join-Path $temp "bad-digest.json"
            $badDigestOutput = Join-Path $temp "bad-digest-envelope.json"
            [System.IO.File]::WriteAllText($badDigestPath, ($badDigest | ConvertTo-Json -Depth 5), [System.Text.UTF8Encoding]::new($false))
            & pwsh -NoProfile -File "private-source/tools/sign-update-manifest.ps1" `
              -PayloadPath $badDigestPath `
              -PackagePath $zipPath `
              -PrivateKeyPath $testPrivate `
              -KeyId $keyId `
              -OutputPath $badDigestOutput
            if ($LASTEXITCODE -eq 0 -or (Test-Path -LiteralPath $badDigestOutput)) {
              throw "Offline signer accepted a package digest mismatch."
            }
            $global:LASTEXITCODE = 0
            Write-Host "PASS: signer rejects package digest mismatches."

            # Negative case 2: reject a package URL that points away from the dedicated host.
            $badHost = [ordered]@{}
            foreach ($entry in $payload.GetEnumerator()) { $badHost[$entry.Key] = $entry.Value }
            $badHost.packageUrl = "https://example.invalid/stable/XboxHub-99.0.0-win-x64.zip"
            $badHostPath = Join-Path $temp "bad-host.json"
            $badHostOutput = Join-Path $temp "bad-host-envelope.json"
            [System.IO.File]::WriteAllText($badHostPath, ($badHost | ConvertTo-Json -Depth 5), [System.Text.UTF8Encoding]::new($false))
            & pwsh -NoProfile -File "private-source/tools/sign-update-manifest.ps1" `
              -PayloadPath $badHostPath `
              -PackagePath $zipPath `
              -PrivateKeyPath $testPrivate `
              -KeyId $keyId `
              -OutputPath $badHostOutput
            if ($LASTEXITCODE -eq 0 -or (Test-Path -LiteralPath $badHostOutput)) {
              throw "Offline signer accepted a package URL on an untrusted host."
            }
            $global:LASTEXITCODE = 0
            Write-Host "PASS: signer rejects cross-host package URLs."

            # Negative case 3: reject a key ID that does not match the private key.
            $badKeyOutput = Join-Path $temp "bad-key-envelope.json"
            & pwsh -NoProfile -File "private-source/tools/sign-update-manifest.ps1" `
              -PayloadPath $payloadPath `
              -PackagePath $zipPath `
              -PrivateKeyPath $testPrivate `
              -KeyId "xboxhub-rsa3072-0000000000000000" `
              -OutputPath $badKeyOutput
            if ($LASTEXITCODE -eq 0 -or (Test-Path -LiteralPath $badKeyOutput)) {
              throw "Offline signer accepted a mismatched key ID."
            }
            $global:LASTEXITCODE = 0
            Write-Host "PASS: signer rejects a key ID that does not match the private key."
          }
          finally {
            if (Test-Path -LiteralPath $temp) {
              Remove-Item -LiteralPath $temp -Recurse -Force
            }
          }

      - name: Test encrypted package handoff with a throwaway recipient key
        shell: pwsh
        run: |
          $openssl = Get-Command openssl -ErrorAction SilentlyContinue
          if (-not $openssl) {
            $gitOpenSsl = Join-Path $env:ProgramFiles "Git/usr/bin/openssl.exe"
            if (Test-Path -LiteralPath $gitOpenSsl) {
              $env:PATH = "$(Split-Path -Parent $gitOpenSsl);$env:PATH"
              $openssl = Get-Command openssl -ErrorAction SilentlyContinue
            }
          }
          if (-not $openssl) { throw "OpenSSL is required for the ephemeral encryption test." }

          $temp = Join-Path $env:RUNNER_TEMP ("xboxhub-encryption-test-" + [guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $temp | Out-Null
          $securePassphrase = $null
          $previousPassphrase = $env:XBOX_TEST_PACKAGE_PASSPHRASE

          try {
            $validationZip = Join-Path $env:RUNNER_TEMP "XboxHub-win-x64-validation.zip"
            $zipPath = Join-Path $env:RUNNER_TEMP "XboxHub-0.1.7-preview.1-win-x64.zip"
            Copy-Item -LiteralPath $validationZip -Destination $zipPath
            $privateKey = Join-Path $temp "ephemeral-package-private.pem"
            $publicDer = Join-Path $temp "ephemeral-package-public.der"
            $encryptedPath = Join-Path $temp "XboxHub-validation.xhubenc"
            $decryptedPath = Join-Path $temp "XboxHub-validation-decrypted.zip"
            $tamperedPath = Join-Path $temp "XboxHub-validation-tampered.xhubenc"
            $tamperedOutput = Join-Path $temp "must-not-exist.zip"

            $testPassphrase = "XboxHub-CI-" + [guid]::NewGuid().ToString("N") + [guid]::NewGuid().ToString("N")
            $env:XBOX_TEST_PACKAGE_PASSPHRASE = $testPassphrase

            & $openssl.Source genrsa -aes256 -passout env:XBOX_TEST_PACKAGE_PASSPHRASE -out $privateKey 3072
            if ($LASTEXITCODE -ne 0) { throw "Could not generate encrypted ephemeral package recipient key." }

            & $openssl.Source pkey -in $privateKey -passin env:XBOX_TEST_PACKAGE_PASSPHRASE -pubout -outform DER -out $publicDer
            if ($LASTEXITCODE -ne 0) { throw "Could not export ephemeral package recipient public key." }

            $publicBytes = [System.IO.File]::ReadAllBytes($publicDer)
            $publicBase64 = [Convert]::ToBase64String($publicBytes)
            $fingerprint = (Get-FileHash -LiteralPath $publicDer -Algorithm SHA256).Hash.ToLowerInvariant()
            $keyId = "xboxhub-package-rsa3072-" + $fingerprint.Substring(0, 16)
            $securePassphrase = ConvertTo-SecureString $testPassphrase -AsPlainText -Force

            & "private-source/tools/Encrypt-XboxHubPackage.ps1" -PackagePath $zipPath -PublicKeyBase64 $publicBase64 -KeyId $keyId -OutputPath $encryptedPath
            if (-not (Test-Path -LiteralPath $encryptedPath)) { throw "Xbox Hub package encryption helper did not create a container." }

            & "private-source/tools/Decrypt-XboxHubPackage.ps1" -EncryptedPackagePath $encryptedPath -PrivateKeyPath $privateKey -OutputPath $decryptedPath -PrivateKeyPassphrase $securePassphrase
            if (-not (Test-Path -LiteralPath $decryptedPath)) { throw "Xbox Hub package decryption helper did not create a ZIP." }

            $originalHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash
            $decryptedHash = (Get-FileHash -LiteralPath $decryptedPath -Algorithm SHA256).Hash
            if ($originalHash -cne $decryptedHash) { throw "Encrypted package round-trip changed the original ZIP bytes." }
            Write-Host "PASS: encrypted package decrypted byte-for-byte using the encrypted RSA private key and passphrase."

            $tamperedBytes = [System.IO.File]::ReadAllBytes($encryptedPath)
            $tamperedBytes[$tamperedBytes.Length - 1] = $tamperedBytes[$tamperedBytes.Length - 1] -bxor 1
            [System.IO.File]::WriteAllBytes($tamperedPath, $tamperedBytes)

            $tamperRejected = $false
            try {
              & "private-source/tools/Decrypt-XboxHubPackage.ps1" -EncryptedPackagePath $tamperedPath -PrivateKeyPath $privateKey -OutputPath $tamperedOutput -PrivateKeyPassphrase $securePassphrase
            }
            catch {
              $tamperRejected = $true
            }
            if (-not $tamperRejected -or (Test-Path -LiteralPath $tamperedOutput)) {
              throw "Package decryption accepted a tampered authenticated ciphertext."
            }
            Write-Host "PASS: AES-GCM authentication rejects a tampered encrypted package."
          }
          finally {
            if ($null -ne $securePassphrase) { $securePassphrase.Dispose() }
            if ($null -ne $previousPassphrase) {
              $env:XBOX_TEST_PACKAGE_PASSPHRASE = $previousPassphrase
            }
            else {
              Remove-Item Env:XBOX_TEST_PACKAGE_PASSPHRASE -ErrorAction SilentlyContinue
            }
            if (Test-Path -LiteralPath $temp) {
              Remove-Item -LiteralPath $temp -Recurse -Force
            }
            $global:LASTEXITCODE = 0
          }

      - name: Encrypt validated package for owner's public key (optional)
        id: encrypted_package
        shell: pwsh
        run: |
          $publicKeyFile = "private-source/tools/package-encryption-public-base64.txt"
          $keyIdFile = "private-source/tools/package-encryption-key-id.txt"

          if (-not (Test-Path -LiteralPath $publicKeyFile) -or -not (Test-Path -LiteralPath $keyIdFile)) {
            Write-Host "Owner package-encryption public key is not configured; no artifact will be uploaded."
            "encrypted_path=" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $publicBase64 = (Get-Content -LiteralPath $publicKeyFile -Raw).Trim()
          $keyId = (Get-Content -LiteralPath $keyIdFile -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($publicBase64) -or [string]::IsNullOrWhiteSpace($keyId)) {
            throw "Owner package-encryption public key configuration is incomplete."
          }

          $appProject = "private-source/src/XboxHub.Desktop/XboxHub.Desktop.csproj"
          $version = (dotnet msbuild $appProject -getProperty:InformationalVersion -nologo).Trim()
          $zipPath = Join-Path $env:RUNNER_TEMP "XboxHub-$version-win-x64.zip"
          if (-not (Test-Path -LiteralPath $zipPath)) { throw "Validated plaintext ZIP is missing from runner temporary storage." }

          $encryptedPath = Join-Path $env:RUNNER_TEMP "XboxHub-$version-win-x64.xhubenc"
          & pwsh -NoProfile -File "private-source/tools/Encrypt-XboxHubPackage.ps1" `
            -PackagePath $zipPath `
            -PublicKeyBase64 $publicBase64 `
            -KeyId $keyId `
            -OutputPath $encryptedPath
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $encryptedPath)) {
            throw "Could not encrypt the package for the owner's public recipient key."
          }
          "encrypted_path=$encryptedPath" >> $env:GITHUB_OUTPUT

      - name: Create non-secret release metadata for the encrypted candidate
        id: release_metadata
        if: ${{ steps.encrypted_package.outputs.encrypted_path != '' }}
        shell: pwsh
        run: |
          $appProject = "private-source/src/XboxHub.Desktop/XboxHub.Desktop.csproj"
          $changelogPath = "private-source/src/XboxHub.Desktop/Resources/changelog.json"
          if (-not (Test-Path -LiteralPath $appProject) -or -not (Test-Path -LiteralPath $changelogPath)) {
            throw "The project version or embedded changelog is missing."
          }

          $version = (dotnet msbuild $appProject -getProperty:InformationalVersion -nologo).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$') {
            throw "The app version is not valid three-part semantic version metadata."
          }
          $isStable = $version -match '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          $entries = @(Get-Content -LiteralPath $changelogPath -Raw | ConvertFrom-Json -ErrorAction Stop)
          $entry = $entries | Where-Object { $_.version -ceq $version } | Select-Object -First 1
          if ($null -eq $entry) { throw "No changelog entry matches app version $version." }
          if ([string]::IsNullOrWhiteSpace([string]$entry.title) -or
              [string]::IsNullOrWhiteSpace([string]$entry.date) -or
              @($entry.changes).Count -lt 1 -or @($entry.changes).Count -gt 20) {
            throw "The matching changelog entry is incomplete or has an invalid number of release notes."
          }

          $releaseSequence = $null
          $channel = "preview"
          if ($isStable) {
            $parsedVersion = [version]$version
            if ($parsedVersion.Major -ge 1000000 -or $parsedVersion.Minor -ge 1000000 -or $parsedVersion.Build -ge 1000000) {
              throw "Version components exceed the supported release-sequence range."
            }
            $releaseSequence = ([long]$parsedVersion.Major * 1000000000000L) + ([long]$parsedVersion.Minor * 1000000L) + [long]$parsedVersion.Build
            if ($releaseSequence -le 0) { throw "Computed release sequence is not positive." }
            $channel = "stable"
          }

          $zipPath = Join-Path $env:RUNNER_TEMP ("XboxHub-" + $version + "-win-x64.zip")
          if (-not (Test-Path -LiteralPath $zipPath)) { throw "The exact validated plaintext ZIP is missing from runner temporary storage." }
          $sourceSha = (git -C private-source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sourceSha -notmatch '^[0-9a-f]{40}$') { throw "Could not determine the exact private-source commit." }

          $metadata = [ordered]@{
            schemaVersion = 1
            productId = "xbox-hub-for-pc"
            channel = $channel
            version = $version
            releaseSequence = $releaseSequence
            platform = "windows"
            architecture = "x64"
            packageFileName = [System.IO.Path]::GetFileName($zipPath)
            packageSize = [long](Get-Item -LiteralPath $zipPath).Length
            packageSha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            minimumUpdaterVersion = "0.1.9"
            title = ([string]$entry.title).Trim()
            date = ([string]$entry.date).Trim()
            changes = @($entry.changes | ForEach-Object { ([string]$_).Trim() })
            sourceSha = $sourceSha
            builderRunId = [long]$env:GITHUB_RUN_ID
            builderRunAttempt = [int]$env:GITHUB_RUN_ATTEMPT
          }
          if ($metadata.packageSize -le 0 -or $metadata.packageSize -gt 734003200 -or $metadata.packageSha256 -notmatch '^[a-f0-9]{64}$') {
            throw "The plaintext package identity is invalid."
          }
          $metadataPath = Join-Path $env:RUNNER_TEMP "xboxhub-release-metadata.json"
          [System.IO.File]::WriteAllText($metadataPath, ($metadata | ConvertTo-Json -Depth 6), [System.Text.UTF8Encoding]::new($false))
          "metadata_path=$metadataPath" >> $env:GITHUB_OUTPUT
          Write-Host "Created non-secret $channel release metadata for version $version and source $sourceSha."
          Write-Host "No application source, key material, or credential is included in this metadata file."

      - name: Upload authenticated encrypted package only
        if: ${{ steps.encrypted_package.outputs.encrypted_path != '' && steps.release_metadata.outputs.metadata_path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: xboxhub-encrypted-offline-package
          path: ${{ steps.encrypted_package.outputs.encrypted_path }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Upload non-secret release metadata sidecar
        if: ${{ steps.encrypted_package.outputs.encrypted_path != '' && steps.release_metadata.outputs.metadata_path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: xboxhub-release-metadata
          path: ${{ steps.release_metadata.outputs.metadata_path }}
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      - name: Test updater replacement and rollback transactions
        shell: pwsh
        run: |
          $testProject = "private-source/src/XboxHub.Updater.Tests/XboxHub.Updater.Tests.csproj"
          if (-not (Test-Path -LiteralPath $testProject)) { throw "Updater transaction test project is missing." }

          dotnet run --project $testProject --configuration Release --verbosity minimal
          if ($LASTEXITCODE -ne 0) { throw "Updater replacement and rollback tests failed." }

      - name: Report build result without exposing source
        if: success()
        shell: pwsh
        run: |
          Write-Host "Xbox Hub for PC app and standalone updater validated successfully."
          Write-Host "No private source, plaintext app package, signing key, decryption key, or credential was uploaded."
          $encryptedPath = "${{ steps.encrypted_package.outputs.encrypted_path }}"
          $metadataPath = "${{ steps.release_metadata.outputs.metadata_path }}"
          if (-not [string]::IsNullOrWhiteSpace($encryptedPath) -and -not [string]::IsNullOrWhiteSpace($metadataPath)) {
            Write-Host "Uploaded the authenticated encrypted package plus a non-secret release-metadata sidecar."
          }
          else {
            Write-Host "No deployable release artifact was uploaded because encryption or release metadata is not configured."
          }

  record-successful-source-revision:
    needs:
      - detect-private-source-revision
      - build-private-windows-app
    if: github.ref == 'refs/heads/main' && success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out public builder repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Record successful build using an immutable source-revision tag
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.detect-private-source-revision.outputs.source_sha }}
        run: |
          set -euo pipefail
          tag="xboxhub-source-$SOURCE_SHA"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Build marker already exists: $tag"
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
            echo "Recorded successful build: $tag"
          fi
