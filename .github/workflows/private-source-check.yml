name: Private source connectivity check

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: private-source-check
  cancel-in-progress: true

jobs:
  inspect-private-source:
    # Do not run this secret-bearing job from arbitrary branches or pull requests.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out private application repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: loudply0-eng/Xbox-Hub-for-PC
          ref: main
          ssh-key: ${{ secrets.SOURCE_REPO_DEPLOY_KEY }}
          path: private-source
          persist-credentials: false
          submodules: false
          lfs: false
          fetch-depth: 1

      - name: Inspect build manifests without printing source
        shell: bash
        run: |
          set -euo pipefail

          test -f private-source/README.md

          echo "Private source checkout succeeded."
          echo "Source repository: loudply0-eng/Xbox-Hub-for-PC"
          echo "Source ref: main"

          manifest_count="$(find private-source -type f \( -name '*.sln' -o -name '*.slnx' -o -name '*.csproj' -o -name 'pubspec.yaml' -o -name 'package.json' \) -not -path '*/.git/*' -print | wc -l | tr -d ' ')"

          if [[ "$manifest_count" == "0" ]]; then
            echo "No application build manifest found."
            echo "The private repository is currently a planning scaffold."
            echo "No compilation or artifact generation was attempted."
          else
            echo "Found $manifest_count possible build manifest(s)."
            echo "File paths and source contents were not emitted."
          fi

      - name: Test offline update handoff tools with disposable keys
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check cryptography
          python -m py_compile \
            private-source/tools/sign_xboxhub_manifest.py \
            private-source/tools/test_sign_xboxhub_manifest.py \
            private-source/tools/decrypt_xboxhub_package.py \
            private-source/tools/test_decrypt_xboxhub_package.py
          python -m unittest discover \
            -s private-source/tools \
            -p 'test_*.py' \
            -v
